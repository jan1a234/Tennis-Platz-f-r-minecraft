name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build dumpClasspath --stacktrace
      - run: ls -la build/cp && du -sh build/cp
      - uses: actions/upload-artifact@v7
        with:
          name: classpath
          path: build/cp/
